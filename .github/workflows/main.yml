name: Update data json

on:
  schedule:
    # 原本是 '*/10 * * * *'（每 10 分鐘）。GitHub 對高頻排程降級最兇，
    # 實測 199 次更新的間隔中位數是 53 分、平均 120 分，落在 15 分內的只有 0.5%
    # —— 設每 10 分鐘完全沒有意義，只是把 repo 灌成 1500+ 個 commit。
    #
    # 網站的即時性交給 Cloudflare Worker（見 worker/），slots.json 只負責
    # 開頁面的第一畫面與 Worker 失效時的備援，每小時一次綽綽有餘。
    # 避開 :00，那是全球排程最擁塞的時間點。
    #
    # 注意：原本這裡有一行 timezone: "Asia/Taipei" —— GitHub Actions 不支援
    # 這個欄位（那是 GitLab 的功能），寫了會被靜默忽略，cron 一律是 UTC。
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-court-data
  # 原本是 true。GitHub 積壓後會把多個排程一次放行，開著會讓它們互相取消，
  # 反而更抓不到資料。改成 false 讓它們排隊執行。
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests python-dotenv
          fi

      - name: Fetch court data
        env:
          FIT17_ACCOUNT: ${{ secrets.FIT17_ACCOUNT }}
          FIT17_PASSWORD: ${{ secrets.FIT17_PASSWORD }}
        run: python fetch_courts.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add slots.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            NOW=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')
            git commit -m "更新場地資料 $NOW"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
